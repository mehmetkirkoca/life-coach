services:
  mongodb:
    image: mongo:7.0
    container_name: coaching-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_HOST_PORT:-27019}:27017"
    volumes:
      - mongodb_data:/data/db

  coaching-app:
    build: .
    container_name: interactive-coaching-container
    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
      - MONGO_URI=mongodb://mongodb:27017/life-coach
    volumes:
      - ./coaching_state.json:/app/coaching_state.json
      - ~/.gemini/config:/host_gemini_config
    depends_on:
      - mongodb
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  mongodb_data:
