version: '3.8'

services:
  coaching-app:
    build: .
    container_name: interactive-coaching-container
    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
    volumes:
      - ./coaching_state.json:/app/coaching_state.json
    restart: unless-stopped
    stdin_open: true
    tty: true
